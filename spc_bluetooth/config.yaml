name: SPC Bluetooth Logger
version: "0.2.6"
slug: spc_bluetooth
description: Monitor SPC III inverter readings and control source priorities over Bluetooth.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_dbus: true
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
map:
  - type: share
    read_only: false
options:
  address: ""
  adapter: hci0
  pin: ""
  pair: true
  poll_seconds: 20
  stale_seconds: 180
  retention_days: 14
  diagnostics: false
  web: true
  mqtt: true
  allow_control: false
  output_dir: /share/spc_bluetooth
schema:
  address: "match(^$|^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)"
  adapter: "match(^hci[0-9]+$)"
  pin: password
  pair: bool
  poll_seconds: "int(5,3600)"
  stale_seconds: "int(5,86400)"
  retention_days: "int(1,365)"
  diagnostics: bool
  web: bool
  mqtt: bool
  allow_control: bool
  output_dir: "match(^/share/spc_bluetooth$)"
